<title>Snake Arena</title>

<style>
:root{--olive:#19240e;--olive2:#293a17;--paper:#f7eac6;--gold:#c49a4c;--copper:#af5435;--text:#f5e6bc}
*{box-sizing:border-box}html,body{width:100%;margin:0;min-height:100%;overscroll-behavior:none;background:#111a0b;color:var(--text);-webkit-tap-highlight-color:transparent}
body{font-family:Georgia,'Times New Roman',serif}.app{position:relative;margin:0 auto;max-width:500px;min-height:100dvh;background:radial-gradient(ellipse at 50% 65%,#34401a,#19230e 68%);box-shadow:0 0 75px #0008;overflow:hidden}
button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #ffe1a2;outline-offset:3px}
.screen{display:none;min-height:100dvh;position:relative}.screen.active{display:flex;flex-direction:column}
#menu{background:#18230e;display:none;overflow:hidden}#menu.active{display:block}
.menu-art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;user-select:none}
.menu-hotspot{position:absolute;left:12%;width:76%;border:0;background:transparent;color:transparent;cursor:pointer;border-radius:90px;touch-action:manipulation;z-index:2}
.menu-hotspot:active{background:#fff3}.menu-hotspot.solo{top:61.8%;height:12.2%}.menu-hotspot.multi{top:74.0%;height:12.5%}
.menu-wisp{position:absolute;width:5px;height:5px;border-radius:50%;background:#edcc8b;opacity:0;pointer-events:none;filter:blur(1px);animation:wisp 6s infinite ease-in-out;top:47%;left:22%}.menu-wisp:nth-of-type(2){left:80%;animation-delay:2s}.menu-wisp:nth-of-type(3){left:38%;top:58%;animation-delay:4s}
@keyframes wisp{0%,100%{opacity:0;transform:translateY(9px)}35%{opacity:.65}70%{opacity:.12;transform:translateY(-28px)}}
.paper{background:radial-gradient(ellipse at 40% 35%,#3a431c70,transparent 62%),#1b270f;isolation:isolate}
.paper:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:-1;opacity:.20;background-image:radial-gradient(#d9bf7d4d .6px,transparent .8px);background-size:7px 7px}
.leaves{position:absolute;width:160px;height:140px;pointer-events:none;opacity:.45}.leaf-one{top:-65px;left:-65px;transform:rotate(30deg);background:radial-gradient(ellipse,#829146 4%,transparent 65%);filter:blur(40px)}.leaf-two{bottom:-60px;right:-50px;background:radial-gradient(ellipse,#829146 4%,transparent 65%);filter:blur(36px)}
.header{height:61px;display:flex;align-items:center;justify-content:space-between;padding:12px 19px 7px;position:relative;z-index:1;flex:none}
.back{width:39px;height:39px;border:1px solid #ad8a4b;border-radius:50%;background:#1b2b13;color:var(--paper);font-family:system-ui;font-size:25px;display:grid;place-items:center}
.header-name{font-size:18px;color:#f6e7bd;font-style:italic;letter-spacing:.03em}
.pill{border:2px solid var(--gold);background:#16210e;border-radius:26px;box-shadow:0 3px 0 #0d1408, inset 0 0 12px #ffffff0b;padding:9px 13px;color:#fbe4ad;font-size:17px;min-width:77px;text-align:center}
.arena-wrap{padding:6px 14px 0;flex:none}

#board{position:absolute;left:1.5%;top:2%;width:97%;height:96%;display:block;touch-action:none}
.hud{display:flex;align-items:center;gap:7px;justify-content:space-between;padding:9px 14px 6px;flex:none;position:relative}
.hud .pill{font-size:16px;padding:6px 12px;min-width:0;white-space:nowrap}.hud .clock{font-size:16px;min-width:75px}.pause{min-width:42px!important;padding:6px 8px!important}
.controls{margin:13px auto 0;display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,54px);gap:3px;place-items:center;touch-action:none;flex:none}
.dir{width:55px;height:55px;border:2px solid #be9a56;box-shadow:inset 0 0 5px #f6dda016,0 3px 5px #0006;background:radial-gradient(circle at 42% 34%,#414d23,#1c290f 78%);border-radius:50%;color:#eddda7;font-family:Arial,sans-serif;font-size:27px;font-weight:bold;line-height:50px;display:grid;place-items:center;user-select:none;touch-action:none}
.dir:active{transform:scale(.93);background:#4e5926}.dir.up{grid-column:2;grid-row:1}.dir.left{grid-column:1;grid-row:2}.dir.right{grid-column:3;grid-row:2}.dir.down{grid-column:2;grid-row:3}
.play-bottom{flex:1;display:flex;justify-content:center;align-items:flex-end;padding:0 15px max(14px,env(safe-area-inset-bottom));min-height:24px}
.small-names{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;padding:0 15px;margin:1px auto;color:#f4e8bd;font:12px system-ui;max-height:40px;overflow:hidden}
.player-chip{display:inline-flex;align-items:center;gap:5px;background:#0c180a66;border-radius:14px;padding:3px 7px}.player-chip:before{content:"";width:8px;height:8px;background:var(--player-color,#c1d75c);border-radius:50%}
.center-content{position:relative;z-index:1;width:min(100%,430px);padding:4px 24px 30px;margin:0 auto;display:flex;flex-direction:column;flex:1}
h1{font-weight:normal;font-size:clamp(38px,10vw,56px);font-style:italic;line-height:1;margin:36px 0 14px;text-align:center;color:var(--paper);text-shadow:1px 2px 0 #0e170d}
h2{font-weight:normal;font-size:31px;font-style:italic;margin:7px 0 14px;text-align:center}.subtitle{font-size:14px;color:#d3c392;text-align:center;margin:0 0 21px}
.stone{display:block;width:100%;border:2px solid #c39b57;color:#233017;background:linear-gradient(165deg,#fff0c7,#e4cd98);border-radius:26px;padding:15px;font-size:23px;font-weight:bold;box-shadow:0 5px 0 #86663e,0 9px 16px #0003;min-height:61px;margin:12px 0;text-align:center}
.stone.copper{background:linear-gradient(155deg,#c26c46,#99462e);color:#f9ead0;border-color:#d5a264;box-shadow:0 5px 0 #733d25,0 9px 16px #0003}
.stone:active{transform:translateY(3px);box-shadow:0 2px 0 #86663e}.stone:disabled{opacity:.5;cursor:default}
.link-btn{border:none;background:none;color:#f5dfab;text-decoration:underline;text-underline-offset:4px;font-size:16px;padding:12px;align-self:center}
.select-number{display:flex;justify-content:center;gap:12px;margin:21px 0}.number{width:64px;height:62px;border-radius:21px;background:#1a2c13;border:2px solid #8e8556;color:#e8d2a0;font-size:28px}.number.selected{background:#eedaa9;color:#223216;border-color:#fce7bc}
.join-row{display:flex;gap:8px;margin:6px 0}.join-row input,.name-row input{min-width:0;flex:1;width:100%;border:2px solid #c5a36a;background:#efe0b7;color:#263513;padding:14px 11px;border-radius:18px;font:20px Georgia,serif;text-align:center;letter-spacing:2px;text-transform:uppercase}
.join-row .stone{width:90px;margin:0;min-height:0;padding:10px 4px;font-size:15px;border-radius:17px}
.name-row{margin:5px 0}.name-row input{text-transform:none;letter-spacing:0;font-size:17px;text-align:left}
.room-code{font-size:42px;letter-spacing:7px;text-align:center;color:#f2dfaa;margin:4px auto 12px;font-weight:bold}
.members{margin:8px 0 13px;display:grid;gap:8px}.member{display:flex;align-items:center;gap:9px;padding:12px 14px;background:#101b0c8a;border:1px solid #b08c4960;border-radius:19px;color:#f4e4ba;font-size:18px}.dot{width:12px;height:12px;border-radius:50%;background:var(--dot,#8fb75c)}.member .who{flex:1}.member .ready{font:12px system-ui;color:#dfc989}
.mini{margin:3px auto;text-align:center;font:13px/1.6 system-ui;color:#dfd0a6}.notice{margin:7px auto;font:14px/1.5 system-ui;color:#ead6a5;text-align:center;max-width:290px}.notice.error{color:#ffd1a6}
.loader{margin:65px auto 18px;width:90px;height:90px;border:4px solid #d7bc7850;border-top-color:#e7d3a3;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.big-number{font-size:88px;text-align:center;margin:35px auto 12px;font-family:Georgia,serif;color:#fbe2a5}
.result-score{font-size:54px;color:#ffe5a2;text-align:center;margin:20px auto}.go-back{margin-top:auto}
@media(max-height:680px){.header{height:48px;padding-top:5px}.hud{padding-top:4px}.controls{margin-top:6px;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,46px)}.dir{width:48px;height:48px;line-height:45px}.arena-wrap{padding-top:1px}.play-bottom{min-height:0;padding-bottom:5px}}
@media(min-width:501px){.app{border-left:1px solid #685736;border-right:1px solid #685736}.screen{min-height:800px}.menu-hotspot:focus-visible{background:#ffffff30}}
@media(prefers-reduced-motion:reduce){.menu-wisp,.loader{animation:none}}
</style>
</head>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),TICK=180;
const BOT='snake_arcade_play_bot',PAGE_URL='https://fcsmgolubjr-bot.github.io/kir-s/snake-arena/static/';
const SERVER='wss://snake-arena-telegram.onrender.com/ws';
const colors=['#a5bd38','#d78551','#8da6d9','#b99dca'];
const dirVec={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]},opposite={up:'down',down:'up',left:'right',right:'left'};
const pages=['menu','home','connecting','lobby','countdown','playing','finished','paused'];
const app={screen:'menu',mode:null,slots:2,ws:null,attempt:0,connectSeq:0,room:'',me:'',players:[],phase:'',isReady:false,state:null,prevState:null,animAt:0,animMs:180,frame:0,round:0};
const tg=window.Telegram?.WebApp;
try{tg?.ready();tg?.expand()}catch(e){}
const nameFallback=()=>{try{return localStorage.getItem('snake_name')||''}catch(e){return ''}};
$('nick').value=(tg?.initDataUnsafe?.user?.first_name||nameFallback()||'Игрок').slice(0,18);
function nick(){const n=$('nick').value.trim().slice(0,18)||'Игрок';try{localStorage.setItem('snake_name',n)}catch(e){}return n}
function screen(name){app.screen=name;pages.forEach(id=>$(id).classList.toggle('active',id===name))}
function stopNetwork(){app.connectSeq++;if(app.ws){const ws=app.ws;app.ws=null;try{ws.close()}catch(e){}}cancelAnimationFrame(app.frame);app.frame=0;app.state=null;app.prevState=null;app.room='';app.me='';app.isReady=false}
const solo={state:null,timer:null,best:0,dir:'right',want:'right',queued:false,paused:false};
function stopSolo(){if(solo.timer)clearTimeout(solo.timer);solo.timer=null;solo.state=null;solo.paused=false}
function menu(){stopNetwork();stopSolo();app.mode=null;screen('menu');try{history.replaceState(null,'',location.pathname)}catch(e){}}
$('home-back').onclick=menu;$('solo-choice').onclick=startSolo;$('multi-choice').onclick=()=>{app.mode='multi';screen('home')};$('connect-back').onclick=menu;$('cancel').onclick=menu;$('lobby-back').onclick=menu;$('leave').onclick=menu;$('exit-game').onclick=menu;$('finish-back').onclick=menu;$('result-menu').onclick=menu;$('pause-menu').onclick=menu;
function soloFood(){let occupied=new Set(solo.state.snakes[0].body.map(p=>p.join(','))),free=[];for(let y=1;y<19;y++)for(let x=1;x<19;x++)if(!occupied.has(x+','+y))free.push([x,y]);return free[Math.floor(Math.random()*free.length)]}
function startSolo(){stopNetwork();stopSolo();app.mode='solo';screen('playing');solo.dir='right';solo.want='right';solo.queued=false;try{solo.best=Number(localStorage.getItem('snake_best')||0)}catch(e){solo.best=0};solo.state={type:'state',width:20,height:20,food:[],snakes:[{id:'solo',name:'Ты',color:colors[0],score:0,alive:true,body:[[5,10],[4,10],[3,10]]}],remaining:0};solo.state.food=[soloFood()];app.state=solo.state;app.prevState=null;app.animAt=performance.now();app.animMs=250;$('pause').textContent='Ⅱ';hud(solo.state);startRender();soloLoop()}
function soloLoop(){if(solo.timer)clearTimeout(solo.timer);if(app.mode==='solo'&&app.screen==='playing'&&!solo.paused)solo.timer=setTimeout(soloTick,Math.max(140,250-solo.state.snakes[0].score*3))}
function soloTick(){if(app.mode!=='solo'||app.screen!=='playing'||solo.paused)return;const s=solo.state,p=s.snakes[0];const before=copyPositions(s);if(solo.want!==opposite[solo.dir])solo.dir=solo.want;solo.queued=false;const [dx,dy]=dirVec[solo.dir],head=[p.body[0][0]+dx,p.body[0][1]+dy],eat=s.food.some(f=>f[0]===head[0]&&f[1]===head[1]);const body=eat?p.body:p.body.slice(0,-1);if(head[0]<0||head[0]>=20||head[1]<0||head[1]>=20||body.some(b=>b[0]===head[0]&&b[1]===head[1])){p.alive=false;draw(s);$('result-title').textContent='Конец игры';$('result-score').textContent='🍎 '+p.score;screen('finished');return;}p.body.unshift(head);if(eat){p.score++;if(p.score>solo.best){solo.best=p.score;try{localStorage.setItem('snake_best',String(solo.best))}catch(e){}}s.food=[soloFood()]}else p.body.pop();app.prevState=before;app.state=s;app.animAt=performance.now();app.animMs=Math.max(140,250-s.snakes[0].score*3);hud(s);startRender();soloLoop()}
$('pause').onclick=()=>{if(app.mode==='solo'&&app.screen==='playing'){solo.paused=true;if(solo.timer)clearTimeout(solo.timer);screen('paused')}else if(app.mode==='multi'){$('pause').textContent='Ⅱ'}};
$('resume').onclick=()=>{solo.paused=false;screen('playing');app.prevState=copyPositions(solo.state);app.animAt=performance.now();startRender();soloLoop()};
const params=new URLSearchParams(location.search);function codeOf(value){let v=String(value||'').trim().toUpperCase();if(v.startsWith('JOIN_'))v=v.slice(5);return /^[A-HJ-NP-Z2-9]{6}$/.test(v)?v:''}
const roomParam=codeOf(params.get('room')||params.get('tgWebAppStartParam')||tg?.initDataUnsafe?.start_param);
const selectSlots=()=>document.querySelectorAll('[data-slots]').forEach(b=>{b.onclick=()=>{app.slots=Number(b.dataset.slots);document.querySelectorAll('[data-slots]').forEach(x=>x.classList.toggle('selected',x===b))}});selectSlots();
$('create').onclick=()=>connect('create','');$('join').onclick=()=>{const code=codeOf($('code').value);if(!code){$('home-error').textContent='Проверь код комнаты';return}connect('join',code)};
$('code').onkeydown=e=>{if(e.key==='Enter')$('join').click()};
function connect(kind,code){stopNetwork();stopSolo();app.mode='multi';app.intent={kind,code};$('connecting-title').textContent=kind==='join'?'Входим в комнату':'Создаём комнату';$('connecting-status').textContent='Подключаемся…';screen('connecting');let seq=app.connectSeq,started=Date.now();function retry(){if(seq!==app.connectSeq)return;if(Date.now()-started>115000){$('connecting-status').textContent='Нет ответа от сервера. Попробуй снова.';return}if(Date.now()-started>6000)$('connecting-status').textContent='Сервер просыпается. Бесплатный Render может запускаться около минуты.';let socket;try{socket=new WebSocket(SERVER)}catch(e){setTimeout(retry,4000);return}app.ws=socket;let joined=false;const watchdog=setTimeout(()=>{if(seq===app.connectSeq&&!joined){try{socket.close()}catch(e){}}},18000);socket.onopen=()=>{if(seq!==app.connectSeq)return;socket.send(JSON.stringify({type:kind,name:nick(),slots:app.slots,code}))};socket.onmessage=e=>{if(seq!==app.connectSeq)return;let p;try{p=JSON.parse(e.data)}catch(_){return}if(p.type==='welcome')joined=true;handle(p)};socket.onerror=()=>{};socket.onclose=()=>{clearTimeout(watchdog);if(seq!==app.connectSeq)return;if(app.screen==='connecting'&&!joined)setTimeout(retry,3700);else if(app.screen==='lobby'||app.screen==='playing'||app.screen==='countdown'){$('connecting-status').textContent='Связь потеряна. Вернись в меню и зайди снова.';screen('connecting')}}};retry()}
function send(packet){if(app.ws?.readyState===WebSocket.OPEN)app.ws.send(JSON.stringify(packet))}
function handle(m){if(m.type==='welcome'){app.me=m.id;app.room=m.code;return}if(m.type==='error'){$('connecting-status').textContent=m.message||'Ошибка подключения';if(app.screen!=='connecting'){$('lobby-status').textContent=m.message||'Ошибка'}return}if(m.type==='lobby'){app.players=m.players||[];app.room=m.code;app.phase=m.phase;app.slots=m.slots;app.isReady=!!app.players.find(p=>p.id===app.me)?.ready;if(m.phase==='lobby'){lobby();screen('lobby');prepareInvite(app.room).catch(()=>{})}return}if(m.type==='countdown'){screen('countdown');$('count').textContent=m.seconds;return}if(m.type==='match_start'){app.state=null;app.prevState=null;screen('playing');$('pause').style.opacity='.35';return}if(m.type==='state'){const now=performance.now();app.prevState=visualAt(now)||app.state;app.state=m;app.animAt=now;app.animMs=TICK;if(app.screen==='countdown')screen('playing');hud(m);startRender();return}if(m.type==='result'){cancelAnimationFrame(app.frame);app.frame=0;const winner=m.players?.find(x=>x.id===m.winnerId);$('result-title').textContent=m.winnerId===app.me?'Победа!':winner?'Победил '+winner.name:'Ничья';$('result-score').textContent='🍎 '+(m.players?.find(x=>x.id===app.me)?.score??0);screen('finished');return}}
function lobby(){$('room-code').textContent=app.room;$('members-count').textContent=app.players.length+' / '+app.slots;$('ready').textContent=app.isReady?'Готов ✓':'Готов!';$('lobby-status').textContent=app.players.length<app.slots?'Пригласи друзей':'Все на месте? Нажми «Готов!»';const box=$('members');box.replaceChildren();for(const [i,p] of app.players.entries()){const el=document.createElement('div');el.className='member';const dot=document.createElement('i');dot.className='dot';dot.style.setProperty('--dot',colors[i]);const label=document.createElement('span');label.className='who';label.textContent=p.name;const ready=document.createElement('span');ready.className='ready';ready.textContent=p.ready?'✓':'…';el.append(dot,label,ready);box.append(el)}}
$('ready').onclick=()=>send({type:'ready',value:!app.isReady});$('again').onclick=()=>{if(app.mode==='solo')startSolo();else send({type:'again'})};
// Native Telegram share: compact message with a real join button, no long URL.
const INVITE_API='https://snake-arena-telegram.onrender.com/api/prepared-invite';
const invitation={code:'',id:'',pending:null};
function inviteUrl(){return 'https://t.me/'+BOT+'?start=join_'+app.room}
async function prepareInvite(code){
  if(!tg?.shareMessage||!tg?.initData||!code) return null;
  if(invitation.code===code&&invitation.id)return invitation.id;
  if(invitation.code===code&&invitation.pending)return invitation.pending;
  invitation.code=code;invitation.id='';
  const promise=(async()=>{
    const response=await fetch(INVITE_API,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code,initData:tg.initData})
    });
    if(!response.ok)throw new Error('Invite API '+response.status);
    const data=await response.json();
    if(typeof data.id!=='string'||!data.id)throw new Error('Bad invite response');
    if(invitation.code===code)invitation.id=data.id;
    return data.id;
  })();
  invitation.pending=promise;
  try{return await promise}finally{if(invitation.pending===promise)invitation.pending=null}
}
$('invite').onclick=async()=>{
  const code=app.room,link=inviteUrl();
  $('lobby-status').textContent='Готовим приглашение…';
  if(tg?.shareMessage&&tg?.initData){
    try{
      const prepared=await prepareInvite(code);
      if(prepared&&code===app.room){
        tg.shareMessage(prepared,ok=>{$('lobby-status').textContent=ok?'Приглашение отправлено':'Можно пригласить ещё одного друга'});
        return;
      }
    }catch(_){}
  }
  // Older Telegram clients and ordinary browsers use the short link.
  try{
    if(tg?.openTelegramLink){
      tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(link));
      $('lobby-status').textContent='Выбери чат для приглашения';
      return;
    }
    if(navigator.share){
      await navigator.share({title:'Snake Arena',text:'Заходи играть!',url:link});
      $('lobby-status').textContent='Приглашение отправлено';
      return;
    }
    await navigator.clipboard.writeText(link);
    $('lobby-status').textContent='Короткая ссылка скопирована';
  }catch(_){$('lobby-status').textContent='Ссылка: '+link}
};
function hud(s){const mine=s.snakes.find(p=>p.id===app.me)||s.snakes[0];$('score-hud').textContent='🏆 '+(mine?.score||0);$('time-hud').textContent=app.mode==='solo'?'🍎 '+(mine?.score||0):'⏳ '+Math.max(0,s.remaining)+'с';const ls=$('player-list');ls.replaceChildren();if(app.mode==='multi')for(const p of s.snakes){const el=document.createElement('span');el.className='player-chip';el.style.setProperty('--player-color',p.color);el.textContent=p.name+' '+p.score;el.style.opacity=p.alive?'1':'.5';ls.append(el)}}
const canvas=$('board'),ctx=canvas.getContext('2d');const W=600;
// Moving snake art uses a single rounded organic stroke, not a chain of rectangular tiles.
function draw(s,old=null,t=1){if(!s||app.screen!=='playing')return;const w=s.width||20,h=s.height||20,unit=W/w,unitY=W/h;ctx.clearRect(0,0,W,W);for(const [x,y] of s.food){let px=(x+.5)*unit,py=(y+.5)*unitY;drawApple(px,py,unit*.39,'#c83f2b')}if(s.bonus){drawApple((s.bonus[0]+.5)*unit,(s.bonus[1]+.5)*unitY,unit*.43,'#ddb24f')}
for(const snake of s.snakes){let older=old?.snakes?.find(x=>x.id===snake.id);let pts=snake.body.map(([x,y],i)=>{let op=older?.body?.[i]||[x,y];if(Math.abs(op[0]-x)>1||Math.abs(op[1]-y)>1)op=[x,y];return [(op[0]+(x-op[0])*t+.5)*unit,(op[1]+(y-op[1])*t+.5)*unitY]});if(!pts.length)continue;ctx.globalAlpha=snake.alive?1:.27;const col=snake.color||colors[0];ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#15220a';ctx.lineWidth=unit*.88;path(pts);ctx.stroke();ctx.strokeStyle=col;ctx.lineWidth=unit*.73;path(pts);ctx.stroke();ctx.strokeStyle='#f3ea9a34';ctx.lineWidth=unit*.21;path(pts.map(p=>[p[0]-unit*.06,p[1]-unit*.08]));ctx.stroke();
// Short darker patches create the soft striped snake from the approved reference.
for(let i=1;i<pts.length;i+=2){const p=pts[i],q=pts[Math.min(i+1,pts.length-1)];const a=Math.atan2(p[1]-q[1],p[0]-q[0]);ctx.save();ctx.translate(p[0],p[1]);ctx.rotate(a);ctx.fillStyle='#1e341f44';ctx.beginPath();ctx.ellipse(0,0,unit*.28,unit*.20,0,0,Math.PI*2);ctx.fill();ctx.restore()}const head=pts[0],next=pts[1]||[head[0]-unit,head[1]];const rot=Math.atan2(head[1]-next[1],head[0]-next[0]);ctx.save();ctx.translate(head[0],head[1]);ctx.rotate(rot);ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,0,unit*.55,unit*.43,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111d09';for(const ey of [-.21,.21]){ctx.beginPath();ctx.ellipse(unit*.16,unit*ey,unit*.07,unit*.11,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff9d7';ctx.fillRect(unit*.13,unit*(ey-.07),unit*.027,unit*.04);ctx.fillStyle='#111d09'}ctx.strokeStyle='#b34433';ctx.lineWidth=Math.max(1.5,unit*.06);ctx.beginPath();ctx.moveTo(unit*.50,0);ctx.lineTo(unit*.76,0);ctx.lineTo(unit*.86,-unit*.12);ctx.moveTo(unit*.76,0);ctx.lineTo(unit*.86,unit*.10);ctx.stroke();ctx.restore();ctx.globalAlpha=1}}
function drawApple(x,y,r,col){ctx.fillStyle='#0b130a55';ctx.beginPath();ctx.ellipse(x+2,y+4,r*1.05,r*.85,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffedbd80';ctx.beginPath();ctx.ellipse(x-r*.35,y-r*.34,r*.17,r*.23,-.5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#5b421f';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y-r*.8);ctx.lineTo(x+2,y-r*1.2);ctx.stroke();ctx.fillStyle='#7da043';ctx.beginPath();ctx.ellipse(x+r*.33,y-r*1.05,r*.33,r*.14,-.5,0,Math.PI*2);ctx.fill()}
function path(pts){ctx.beginPath();if(pts.length===1){ctx.moveTo(pts[0][0],pts[0][1]);ctx.lineTo(pts[0][0]+.1,pts[0][1]);return}ctx.moveTo(pts.at(-1)[0],pts.at(-1)[1]);for(let i=pts.length-2;i>=1;i--){const a=pts[i],b=pts[i-1];ctx.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2)}ctx.lineTo(pts[0][0],pts[0][1])}
// Persistent 60 FPS renderer; movement is independent of server/solo ticks.
function copyPositions(s){return s&&{...s,snakes:s.snakes.map(p=>({...p,body:p.body.map(v=>v.slice())}))}}
function visualAt(now){
  const to=app.state;if(!to)return null;
  const from=app.prevState;
  const t=Math.max(0,Math.min(1,(now-app.animAt)/Math.max(1,app.animMs)));
  if(!from||t>=1)return to;
  return {...to,snakes:to.snakes.map(p=>{
    const old=from.snakes?.find(x=>x.id===p.id);
    return {...p,body:p.body.map((pos,i)=>{
      const q=old?.body?.[i]||pos;
      if(Math.abs(q[0]-pos[0])>3||Math.abs(q[1]-pos[1])>3)return pos;
      return [q[0]+(pos[0]-q[0])*t,q[1]+(pos[1]-q[1])*t];
    })};
  })};
}
function startRender(){
  if(app.frame||app.screen!=='playing')return;
  const frame=now=>{
    if(app.screen!=='playing'||!app.state){app.frame=0;return}
    draw(visualAt(now));
    app.frame=requestAnimationFrame(frame);
  };
  app.frame=requestAnimationFrame(frame);
}
function turn(d){if(!dirVec[d]||app.screen!=='playing')return;if(app.mode==='solo'){if(!solo.queued&&!solo.paused&&d!==opposite[solo.dir]){solo.want=d;solo.queued=true}}else send({type:'turn',direction:d})}
for(const b of document.querySelectorAll('[data-dir]'))b.addEventListener('pointerdown',e=>{e.preventDefault();turn(b.dataset.dir)});
const keymap={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',a:'left',s:'down',d:'right',W:'up',A:'left',S:'down',D:'right'};window.addEventListener('keydown',e=>{if(keymap[e.key]){e.preventDefault();turn(keymap[e.key])}if(e.key==='Escape'&&app.mode==='solo'&&app.screen==='playing')$('pause').click()});
let touch=null;canvas.addEventListener('touchstart',e=>{if(e.touches[0])touch=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});canvas.addEventListener('touchend',e=>{if(!touch||!e.changedTouches[0])return;const dx=e.changedTouches[0].clientX-touch[0],dy=e.changedTouches[0].clientY-touch[1];touch=null;if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;turn(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')},{passive:true});document.addEventListener('visibilitychange',()=>{if(document.hidden&&app.mode==='solo'&&app.screen==='playing')$('pause').click()});
if(roomParam){$('code').value=roomParam;connect('join',roomParam)}else if(params.get('mode')==='multi'){app.mode='multi';screen('home')}else if(params.get('mode')==='solo'){startSolo()}
})();
</script></body></html>
