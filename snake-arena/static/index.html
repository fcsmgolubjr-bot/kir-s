<body>
<div class="shell">
  <div class="top"><div class="logo">Змейка<span class="logo-dot">.</span></div><span id="signal" class="signal" aria-live="polite">Готово</span></div>

    <div class="pad" id="pad"><button class="arrow up" data-dir="up" aria-label="Вверх">↑</button><button class="arrow left" data-dir="left" aria-label="Влево">←</button><button class="arrow down" data-dir="down" aria-label="Вниз">↓</button><button class="arrow right" data-dir="right" aria-label="Вправо">→</button></div>
  </section>

  <p id="error" class="error" role="status" aria-live="polite"></p>

</div>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const screens = ['choose','home','lobby','countdown','playing','finished'];
  const app = { ws:null, me:'', room:'', slots:2, players:[], ready:false, phase:'choose', last:null, mode:null };
  const tg=window.Telegram?.WebApp;
  try {tg?.ready();tg?.expand();} catch(_){}
  const getStoredName=()=>{try{return localStorage.getItem('snake_name')||'';}catch(_){return '';}};
  const saveName=name=>{try{localStorage.setItem('snake_name',name);}catch(_){}};
  const suggestedName = tg?.initDataUnsafe?.user?.first_name || getStoredName();
  $('nick').value=suggestedName.slice(0,18);
  const urlParams = new URLSearchParams(location.search);
  const codeFromLink = urlParams.get('room') || tg?.initDataUnsafe?.start_param || '';
  if(/^[A-Z2-9]{6}$/i.test(codeFromLink)){ $('code').value=codeFromLink.toUpperCase(); app.mode='multi'; $('choose').classList.remove('active'); $('home').classList.add('active');app.phase='home'; }
  else if(urlParams.get('mode') === 'multi'){ app.mode='multi'; $('choose').classList.remove('active'); $('home').classList.add('active'); app.phase='home'; }
  const show=(screen)=>{app.phase=screen;for(const s of screens)$(s).classList.toggle('active',s===screen);};
  const error=msg=>{ $('error').textContent=msg||''; };
  const signal=(good,text)=>{$('signal').classList.toggle('online',good);$('signal').textContent=text;};
  const link=()=>{const url=new URL(location.href);url.searchParams.set('room',app.room);return url.href;};
  const send=payload=>{if(app.ws?.readyState===WebSocket.OPEN)app.ws.send(JSON.stringify(payload));};
  const serverUrl=()=>{
    // A single FastAPI service hosts this page and the websocket at /ws.
    // A separate static host can set window.SNAKE_WS_URL to a secure wss:// address.
    if(typeof window.SNAKE_WS_URL==='string' && window.SNAKE_WS_URL.trim())return window.SNAKE_WS_URL.trim();
    return 'wss://snake-arena-telegram.onrender.com/ws';
  };
  function connect(initial) {
    error('');
    if(app.ws)try{app.ws.close();}catch(_){}
    const ws=new WebSocket(serverUrl());app.ws=ws;
    signal(false,'Соединение…');
    const guard=setTimeout(()=>{if(ws.readyState!==WebSocket.OPEN)ws.close();},90000);
    const waking=setTimeout(()=>{if(app.ws===ws && ws.readyState!==WebSocket.OPEN){signal(false,'Сервер запускается');error('Первое подключение к матчу может занять около минуты.');}},4500);
    ws.addEventListener('open',()=>{clearTimeout(guard);clearTimeout(waking);error('');if(app.ws!==ws)return;signal(true,'На связи');send(initial);});
    ws.addEventListener('error',()=>{if(app.ws===ws)error('Не удалось подключиться. Проверь адрес сервера и интернет.');});
    ws.addEventListener('close',()=>{clearTimeout(guard);clearTimeout(waking);if(app.ws!==ws)return;clearNetworkAnimation();signal(false,'Нет соединения');if(app.phase!=='home'){show('home');error('Связь с матчем потеряна. Создай или войди в комнату заново.');}});
    ws.addEventListener('message',event=>{if(app.ws!==ws)return;let m;try{m=JSON.parse(event.data);}catch(_){return;}onMessage(m);});
  }
  function start(type) {
    app.mode='multi'; stopSolo();
    const name=$('nick').value.trim().slice(0,18)||'Игрок';saveName(name);
    const payload={type,name};if(type==='create')payload.slots=app.slots;else {payload.code=$('code').value.replace(/[^A-Z2-9]/gi,'').toUpperCase();if(payload.code.length!==6){error('Введи шестизначный код комнаты.');return;}}
    $('create').disabled=true;$('join').disabled=true;
    try {connect(payload);} catch (e) {error('Не получается открыть WebSocket: '+e.message);} finally {setTimeout(()=>{$('create').disabled=false;$('join').disabled=false;},500);}
  }
  const escapeText=text=>String(text).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
  function drawLobby(m){
    app.players=m.players||[];app.slots=m.slots;app.room=m.code;app.ready=Boolean(app.players.find(p=>p.id===app.me)?.ready);
    $('room-label').textContent=m.code;$('roomcode').textContent=m.code;
    $('lobbyinfo').textContent=`Игроков: ${app.players.length} / ${m.slots}. Начнём, когда все будут готовы.`;
    $('members').innerHTML=app.players.map(p=>`<div class="member"><i class="dot" style="background:${p.color}"></i><span class="name">${escapeText(p.name)}${p.id===app.me&&p.name!=='Ты'?' (ты)':''}</span><span class="state">${p.ready?'✓ Готов':'Ожидание'}</span></div>`).join('');
    $('ready').textContent=app.ready?'Отменить готовность':'Я готов!';
    if(m.phase==='lobby')show('lobby');
  }
  const formatClock=sec=>`${String(Math.floor(Math.max(sec,0)/60)).padStart(2,'0')}:${String(Math.max(sec,0)%60).padStart(2,'0')}`;
  function onMessage(m) {
    if(app.mode!=='multi')return;
    switch(m.type){
      case 'welcome':app.me=m.id;app.room=m.code;break;
      case 'lobby':if(m.phase==='lobby')clearNetworkAnimation();drawLobby(m);break;
      case 'countdown':show('countdown');$('count').textContent=m.seconds;break;
      case 'match_start':clearNetworkAnimation();show('playing');$('gamecode').textContent=app.room;break;
      case 'state':app.last=m;acceptNetworkState(m);break;
      case 'result':{
        // The authoritative result ends the animation; no stale frames after match.
        clearNetworkAnimation();
        $('again').textContent='Ещё один матч';
        const mine=m.winnerId===app.me;
        $('result').textContent=m.winnerId?(mine?'🏆 Победа!':`🏆 Победил ${m.players.find(p=>p.id===m.winnerId)?.name||'соперник'}`):'🤝 Ничья';
        $('resultscores').innerHTML=m.players.sort((a,b)=>b.score-a.score).map(p=>`<div class="member"><i class="dot" style="background:${p.color}"></i><span class="name">${escapeText(p.name)}</span><strong>${p.score} 🍎</strong></div>`).join('');
        show('finished');break;
      }
      case 'error':error(m.message||'Ошибка сервера');break;
    }
  }
  const canvas=$('board'),ctx=canvas.getContext('2d');
  // The server sends authoritative grid snapshots every 180 ms (5.6 Hz).
  // Animate ONLY the intermediate pixels at the device refresh rate. No
  // extrapolation: clients never decide movement, collisions or scoring.
  const NETWORK_TICK_MS=180;
  const netAnimation={previous:null,current:null,receivedAt:0,frame:0};
  function clearNetworkAnimation(){
    if(netAnimation.frame)cancelAnimationFrame(netAnimation.frame);
    netAnimation.frame=0;netAnimation.previous=null;netAnimation.current=null;
  }
  function animateNetwork(now){
    netAnimation.frame=0;
    if(app.mode!=='multi'||app.phase!=='playing'||!netAnimation.current)return;
    const progress=Math.max(0,Math.min(1,(now-netAnimation.receivedAt)/NETWORK_TICK_MS));
    draw(netAnimation.current,netAnimation.previous,progress,false);
    if(progress<1)netAnimation.frame=requestAnimationFrame(animateNetwork);
  }
  function acceptNetworkState(snapshot){
    if(app.mode!=='multi'||app.phase!=='playing')return;
    const previous=netAnimation.current;
    // If packets were missed or it is the first snapshot, snap immediately:
    // interpolating over several squares could draw a wall-crossing ghost.
    if(!previous || !Number.isInteger(snapshot.tick)||snapshot.tick!==previous.tick+1){
      clearNetworkAnimation();netAnimation.current=snapshot;draw(snapshot);return;
    }
    netAnimation.previous=previous;
    netAnimation.current=snapshot;
    netAnimation.receivedAt=performance.now();
    draw(snapshot,previous,0,true); // Update score and timer only per network tick.
    if(!netAnimation.frame)netAnimation.frame=requestAnimationFrame(animateNetwork);
  }
  function draw(s,previous=null,progress=1,updateHud=true) {
    if(app.phase==='countdown')show('playing');
    if(app.phase!=='playing')return;
    const w=s.width||20,h=s.height||16,tile=30;
    if(canvas.width!==w*tile)canvas.width=w*tile;if(canvas.height!==h*tile)canvas.height=h*tile;
    ctx.fillStyle='#e8f1db';ctx.fillRect(0,0,canvas.width,canvas.height);
    // Calm grass texture instead of neon tiles; deterministic decorative dots.
    ctx.fillStyle='rgba(125,158,115,.12)';
    for(let i=0;i<52;i++){
      const x=(i*113+17)%canvas.width,y=(i*239+42)%canvas.height;
      ctx.beginPath();ctx.ellipse(x,y,2.6,1.8,.3,0,Math.PI*2);ctx.fill();
    }
    for(const [x,y] of s.food){
      const px=x*tile+15,py=y*tile+15;
      ctx.fillStyle='#ca6f53';ctx.beginPath();ctx.arc(px,py+1,10.5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#e89a78';ctx.beginPath();ctx.arc(px-3,py-3,3.1,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#618e5e';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(px,py-8);ctx.lineTo(px+3,py-13);ctx.stroke();
    }
    if(s.bonus){
      const [bx,by]=s.bonus,px=bx*tile+15,py=by*tile+15;
      ctx.fillStyle='#f8d68b';ctx.beginPath();ctx.arc(px,py,13,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#cf9542';ctx.beginPath();ctx.arc(px,py,9,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff4d8';ctx.font='18px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('★',px,py+1);
    }
    const oldSnakes=previous?new Map(previous.snakes.map(p=>[p.id,p])):null;
    for(const snake of s.snakes){
      const before=oldSnakes?.get(snake.id);
      const body=snake.body.map(([cx,cy],i)=>{
        if(before?.alive&&snake.alive&&progress<1){
          const from=before.body[i] || before.body.at(-1);
          if(from&&Math.abs(cx-from[0])+Math.abs(cy-from[1])<=1)return [from[0]+(cx-from[0])*progress,from[1]+(cy-from[1])*progress];
        }
        return [cx,cy];
      });
      if(!body.length)continue;
      const points=body.map(([x,y])=>[x*tile+15,y*tile+15]);
      ctx.globalAlpha=snake.alive?1:.24;
      ctx.strokeStyle=snake.color;ctx.lineWidth=25;ctx.lineCap='round';ctx.lineJoin='round';
      ctx.beginPath();ctx.moveTo(points[points.length-1][0],points[points.length-1][1]);
      for(let i=points.length-2;i>=0;i--)ctx.lineTo(points[i][0],points[i][1]);ctx.stroke();
      if(snake.alive){
        const [hx,hy]=points[0], neck=points[1]||[hx-30,hy];
        const dx=hx-neck[0],dy=hy-neck[1],len=Math.hypot(dx,dy)||1;
        const ux=dx/len,uy=dy/len,sideX=-uy,sideY=ux;
        ctx.fillStyle=snake.color;ctx.beginPath();ctx.arc(hx,hy,13.6,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#fcf9ef';
        for(const off of [-5.3,5.3]){ctx.beginPath();ctx.arc(hx+ux*4+sideX*off,hy+uy*4+sideY*off,3.4,0,Math.PI*2);ctx.fill();}
        ctx.fillStyle='#28392c';
        for(const off of [-5.3,5.3]){ctx.beginPath();ctx.arc(hx+ux*5+sideX*off,hy+uy*5+sideY*off,1.55,0,Math.PI*2);ctx.fill();}
      }
    }
    ctx.globalAlpha=1;
    if(updateHud){
      $('remaining').textContent=app.mode==='solo'?'∞':formatClock(s.remaining);
      $('scores').innerHTML=s.snakes.map(p=>`<div class="score ${p.alive?'':'dead'}"><i class="dot" style="background:${p.color}"></i><span class="who">${escapeText(p.name)}${p.id===app.me&&p.name!=='Ты'?' (ты)':''}</span><strong>${p.score} 🍎</strong></div>`).join('');
    }
  }
  // Classic single-player mode is deliberately client-side: no rooms or WebSocket.
  const SOLO_W=20, SOLO_H=16;
  const solo={timer:null,paused:false,state:null,direction:'right',wanted:'right',queued:false,best:0};
  const vectors={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
  const opposite={up:'down',down:'up',left:'right',right:'left'};
  const loadBest=()=>{try{return Math.max(0,Number(localStorage.getItem('snake_solo_best'))||0);}catch(_){return 0;}};
  function stopSolo(){if(solo.timer!==null)clearTimeout(solo.timer);solo.timer=null;solo.state=null;solo.paused=false;$('solo-paused').classList.remove('visible');$('solo-tools').classList.remove('visible');}
  function chooseMode(mode){clearNetworkAnimation();app.mode=mode;error('');if(mode==='multi'){signal(false,'Не подключено');show('home');}else startSolo();}
  function newFood(){
    const occupied=new Set(solo.state.snakes[0].body.map(p=>p.join(',')));
    const free=[];for(let y=0;y<SOLO_H;y++)for(let x=0;x<SOLO_W;x++)if(!occupied.has(`${x},${y}`))free.push([x,y]);
    if(!free.length)return null;
    return free[Math.floor(Math.random()*free.length)];
  }
  function startSolo(){
    if(app.ws){const ws=app.ws;app.ws=null;ws.close();}
    stopSolo();app.mode='solo';app.me='solo';app.room='';
    solo.best=loadBest();solo.direction='right';solo.wanted='right';solo.queued=false;
    solo.state={type:'state',width:SOLO_W,height:SOLO_H,remaining:0,food:[],snakes:[{id:'solo',name:'Ты',color:'#438d67',body:[[4,10],[3,10],[2,10]],alive:true,score:0}]};
    const food=newFood();if(food)solo.state.food=[food];
    $('solo-best').textContent=solo.best;$('solo-pause').textContent='Пауза';
    $('solo-tools').classList.add('visible');$('gamecode').textContent='Один игрок';
    signal(true,'Одиночная игра');show('playing');draw(solo.state);
    scheduleSolo();
  }
  function scheduleSolo(){
    if(solo.timer!==null)clearTimeout(solo.timer);
    solo.timer=null;
    if(app.mode==='solo'&&app.phase==='playing'&&!solo.paused&&solo.state){
      const delay=Math.max(155,265-solo.state.snakes[0].score*3);
      solo.timer=setTimeout(soloTick,delay);
    }
  }
  function soloTick(){
    solo.timer=null;
    if(app.mode!=='solo'||app.phase!=='playing'||solo.paused||!solo.state)return;
    const s=solo.state, player=s.snakes[0];
    if(solo.wanted!==opposite[solo.direction])solo.direction=solo.wanted;
    solo.queued=false;
    const [dx,dy]=vectors[solo.direction],head=[player.body[0][0]+dx,player.body[0][1]+dy];
    const eating=s.food.some(p=>p[0]===head[0]&&p[1]===head[1]);
    const bodyCheck=eating?player.body:player.body.slice(0,-1);
    if(head[0]<0||head[0]>=SOLO_W||head[1]<0||head[1]>=SOLO_H||bodyCheck.some(p=>p[0]===head[0]&&p[1]===head[1])){
      player.alive=false;draw(s);
      $('result').textContent=`🍎 Набрано: ${player.score}`;
      $('resultscores').innerHTML=`<div class="member"><span class="name">Лучший результат</span><strong>${solo.best} 🍎</strong></div>`;
      $('again').textContent='↻ Сыграть ещё';$('solo-tools').classList.remove('visible');show('finished');return;
    }
    player.body.unshift(head);
    if(eating){
      player.score++;
      if(player.score>solo.best){solo.best=player.score;try{localStorage.setItem('snake_solo_best',String(solo.best));}catch(_){}}
      $('solo-best').textContent=solo.best;
      if(player.body.length===SOLO_W*SOLO_H){
        draw(s);$('result').textContent='🏆 Всё поле заполнено!';$('resultscores').innerHTML=`<div class="member"><span class="name">Твой рекорд</span><strong>${solo.best} 🍎</strong></div>`;
        $('again').textContent='↻ Сыграть ещё';$('solo-tools').classList.remove('visible');show('finished');return;
      }
      const fruit=newFood();s.food=fruit?[fruit]:[];
    }else player.body.pop();
    draw(s);scheduleSolo();
  }
  function pauseSolo(){
    if(app.mode!=='solo'||app.phase!=='playing'||!solo.state)return;
    solo.paused=!solo.paused;
    $('solo-paused').classList.toggle('visible',solo.paused);
    $('solo-pause').textContent=solo.paused?'Продолжить':'Пауза';
    if(solo.paused){if(solo.timer!==null)clearTimeout(solo.timer);solo.timer=null;}else scheduleSolo();
  }
  const turn=direction=>{
    if(app.phase!=='playing')return;
    if(app.mode==='solo'){
      if(!solo.paused&&!solo.queued&&vectors[direction]&&direction!==opposite[solo.direction]){solo.wanted=direction;solo.queued=true;}
    }else send({type:'turn',direction});
  };
  document.querySelectorAll('#modes button').forEach(b=>b.addEventListener('click',()=>{app.slots=Number(b.dataset.slots);document.querySelectorAll('#modes button').forEach(x=>x.classList.toggle('selected',x===b));}));
  $('solo-choice').addEventListener('click',()=>chooseMode('solo'));
  $('multi-choice').addEventListener('click',()=>chooseMode('multi'));
  $('back-modes').addEventListener('click',()=>{app.mode=null;show('choose');error('');});
  $('solo-pause').addEventListener('click',pauseSolo);
  $('solo-exit').addEventListener('click',()=>{stopSolo();app.mode=null;signal(false,'Не подключено');show('choose');});
  $('create').addEventListener('click',()=>start('create'));$('join').addEventListener('click',()=>start('join'));
  $('code').addEventListener('keydown',e=>{if(e.key==='Enter')start('join');});
  $('ready').addEventListener('click',()=>send({type:'ready',value:!app.ready}));
  const leave=()=>{clearNetworkAnimation();stopSolo();if(app.ws){const sock=app.ws;app.ws=null;sock.close();}app.me='';app.room='';app.mode=null;show('choose');signal(false,'Не подключено');error('');};
  $('leave').addEventListener('click',leave);$('quit').addEventListener('click',leave);
  $('again').addEventListener('click',()=>{if(app.mode==='solo')startSolo();else send({type:'again'});});
  $('share').addEventListener('click',async()=>{const url=link();const text=`Заходи в Змейку! Комната ${app.room}\n${url}`;try{if(navigator.share)await navigator.share({title:'Змейка с друзьями',text,url});else{await navigator.clipboard.writeText(text);$('share').textContent='✓ Приглашение скопировано';setTimeout(()=>$('share').textContent='🔗 Поделиться приглашением',1500);}}catch(e){if(e.name!=='AbortError')error('Ссылка: '+url);}});
  document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();turn(b.dataset.dir);}));
  const keys={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',a:'left',s:'down',d:'right',W:'up',A:'left',S:'down',D:'right'};
  window.addEventListener('keydown',e=>{
    if((e.key===' '||e.key==='Escape')&&app.mode==='solo'&&app.phase==='playing'){
      e.preventDefault();pauseSolo();return;
    }
    const dir=keys[e.key];if(dir&&app.phase==='playing'){e.preventDefault();turn(dir);}
  });
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&app.mode==='solo'&&app.phase==='playing'&&!solo.paused)pauseSolo();});
  let touch=null;canvas.addEventListener('touchstart',e=>{if(e.touches.length)touch={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
  canvas.addEventListener('touchend',e=>{if(!touch||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;touch=null;if(Math.max(Math.abs(dx),Math.abs(dy))<22)return;turn(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up');},{passive:true});
  if(urlParams.get('mode')==='solo' && !codeFromLink)chooseMode('solo');
})();
</script>
</body>
</html>
